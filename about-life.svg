<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <style type="text/css">
    <![CDATA[
    .bg { fill: #0d0e16; }
    .card-border { stroke: #a78bfa; stroke-width: 1.5; fill: none; opacity: 0.4; }
    .title-purple { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; fill: #a78bfa; font-size: 16px; letter-spacing: 1px; }
    .title-pink { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; fill: #f472b6; font-size: 16px; letter-spacing: 1px; }
    .item-text { font-family: monospace, Courier, sans-serif; fill: #e2e8f0; font-size: 13px; }
    .hobby-title { font-family: monospace, Courier, sans-serif; font-weight: bold; font-size: 14px; fill: #22d3ee; }
    .hobby-desc { font-family: monospace, Courier, sans-serif; font-size: 12px; fill: #94a3b8; }
    .bar-bg { fill: none; stroke: #334155; stroke-width: 3; }
    .bar-active { fill: none; stroke: #f472b6; stroke-width: 3; stroke-dasharray: 200; stroke-dashoffset: 200; animation: loadBar 4s linear infinite; }
    @keyframes loadBar { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: 0; } }
    ]]>
  </style>

  <!-- Background & Card Border -->
  <rect width="800" height="220" class="bg" rx="16" />
  <rect width="796" height="216" x="2" y="2" class="card-border" rx="14" />

  <!-- Left Column: What I Build -->
  <g transform="translate(35, 30)">
    <text x="0" y="20" class="title-purple">> WHAT I BUILD</text>
    
    <circle cx="5" cy="52" r="3" fill="#22d3ee" />
    <text x="18" y="56" class="item-text">Custom and interactive web platforms.</text>

    <circle cx="5" cy="77" r="3" fill="#22d3ee" />
    <text x="18" y="81" class="item-text">Dynamic user interfaces with React.</text>

    <circle cx="5" cy="102" r="3" fill="#22d3ee" />
    <text x="18" y="106" class="item-text">Scalable backend solutions and UI designs.</text>

    <circle cx="5" cy="127" r="3" fill="#22d3ee" />
    <text x="18" y="131" class="item-text">SEO and online presence optimization.</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="420" y1="25" x2="420" y2="195" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1" />

  <!-- Right Column: Hobbies Carousel (Crossfade) -->
  <g transform="translate(460, 30)">
    <text x="0" y="20" class="title-pink">> HOBBIES AND PASSION</text>
    
    <!-- Progress Indicator Line -->
    <line x1="0" y1="35" x2="200" y2="35" class="bar-bg" />
    <line x1="0" y1="35" x2="200" y2="35" class="bar-active" />

    <!-- Slide 1: GAMING -->
    <g transform="translate(0, 70)">
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;1" dur="12s" repeatCount="indefinite" />
      <text x="0" y="0" class="hobby-title">[ GAMING ]</text>
      <text x="0" y="25" class="hobby-desc">Leveling up on visual and logic challenges.</text>
    </g>

    <!-- Slide 2: PHOTOGRAPHY -->
    <g transform="translate(0, 70)">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" dur="12s" repeatCount="indefinite" />
      <text x="0" y="0" class="hobby-title">[ PHOTOGRAPHY ]</text>
      <text x="0" y="25" class="hobby-desc">Capturing life framing, shadows and stories.</text>
    </g>

    <!-- Slide 3: TRAVELING -->
    <g transform="translate(0, 70)">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" dur="12s" repeatCount="indefinite" />
      <text x="0" y="0" class="hobby-title">[ TRAVELING ]</text>
      <text x="0" y="25" class="hobby-desc">Exploring cultures, places and inspirations.</text>
    </g>

    <!-- Slide 4: BUSINESS -->
    <g transform="translate(0, 70)">
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" dur="12s" repeatCount="indefinite" />
      <text x="0" y="0" class="hobby-title">[ BUSINESS ]</text>
      <text x="0" y="25" class="hobby-desc">Venturing into digital creative agency.</text>
    </g>
  </g>
</svg>
