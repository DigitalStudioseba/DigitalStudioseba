<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;family=Orbitron:wght@800&amp;display=swap');
    .bg { fill: #0d0e16; }
    .border { stroke: #22d3ee; stroke-width: 1.5; fill: none; opacity: 0.3; }
    .heading { font-family: 'Orbitron', sans-serif; font-weight: 800; fill: #22d3ee; font-size: 16px; }
    .btn { fill: #111221; stroke: #a78bfa; stroke-width: 1; cursor: pointer; transition: 0.3s; }
    .btn:hover { fill: #1e1b4b; stroke: #f472b6; }
    .btn-text { font-family: 'Fira Code', monospace; font-size: 13px; fill: #e2e8f0; font-weight: bold; }
    
    /* Hover-like pulsing animation for the arrow pointer */
    @keyframes arrowMovement { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    .anim-arrow { animation: arrowMovement 1.5s infinite; }
  </style>

  <rect width="800" height="180" class="bg" rx="16"/>
  <rect width="796" height="176" x="2" y="2" class="border" rx="14"/>

  <!-- Visual graphic or user cartoon -->
  <g transform="translate(45, 10)">
    <!-- Let's represent anime styling pointing avatar -->
    <circle cx="50" cy="80" r="32" fill="#1e1b4b" stroke="#22d3ee" stroke-width="1.5"/>
    <!-- Pointing character reference outline -->
    <path d="M 40 100 Q 55 55 65 95 Q 85 90 90 70" fill="none" stroke="#f472b6" stroke-width="3.5" class="anim-arrow"/>
    <text x="105" y="83" font-family="Fira Code" font-size="12" fill="#a78bfa" font-weight="bold">👈 SAY HELLO!</text>
  </g>

  <!-- Title -->
  <g transform="translate(240, 45)">
    <text x="0" y="0" class="heading">🌐 LET'S CONNECT &amp; COLLABORATE</text>
    <text x="0" y="20" font-family="Fira Code" font-size="12" fill="#94a3b8">Let's build something epic together. Contact me anytime!</text>
  </g>

  <!-- Interactive buttons link -->
  <g transform="translate(240, 85)">
    <!-- Email Button -->
    <g class="btn" onclick="window.open('mailto:hello@digiseba.shop')">
      <rect width="160" height="36" rx="18" class="btn"/>
      <text x="80" y="22" class="btn-text" text-anchor="middle">📧 EMAIL ME</text>
    </g>

    <!-- GitHub Button -->
    <g transform="translate(180, 0)" class="btn" onclick="window.open('https://github.com/DigitalStudioseba')">
      <rect width="160" height="36" rx="18" class="btn" style="stroke:#22d3ee;"/>
      <text x="80" y="22" class="btn-text" style="fill:#22d3ee;" text-anchor="middle">🐱 GITHUB</text>
    </g>

    <!-- Brand name -->
    <text x="360" y="23" font-family="Fira Code" font-size="12" fill="#f472b6" font-weight="bold">@DigitalStudioseba</text>
  </g>
</svg>
