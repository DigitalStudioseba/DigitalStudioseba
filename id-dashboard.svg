<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;family=Orbitron:wght@700;800&amp;display=swap');
    .bg { fill: #0d0e16; }
    .border { stroke: #f472b6; stroke-width: 1.5; fill: none; opacity: 0.4; }
    .dashboard-title { font-family: 'Orbitron', sans-serif; font-weight: 800; fill: #f472b6; font-size: 16px; }
    .badge-label { font-family: 'Fira Code', monospace; font-size: 11px; fill: #a78bfa; }
    .stats-val { font-family: 'Orbitron', sans-serif; fill: #22d3ee; font-weight: 800; font-size: 20px; }
  </style>

  <rect width="800" height="220" class="bg" rx="16"/>
  <rect width="796" height="216" x="2" y="2" class="border" rx="14"/>

  <!-- Left Side: ID Badge visual design -->
  <g transform="translate(30, 25)">
    <!-- Simulated ID Badge Box -->
    <rect width="320" height="170" rx="12" fill="#111221" stroke="#a78bfa" stroke-width="1.5"/>
    <rect width="320" height="30" rx="0" fill="#22d3ee" fill-opacity="0.1"/>
    <text x="160" y="20" font-family="Orbitron" font-size="11" font-weight="bold" fill="#22d3ee" text-anchor="middle">STUDIO INTERACTIVE BADGE</text>
    
    <!-- User Photo / Icon approximation (or user character image) -->
    <circle cx="65" cy="100" r="35" fill="#1e1b4b" stroke="#f472b6" stroke-width="2"/>
    <path d="M 45 125 C 45 110, 85 110, 85 125" fill="none" stroke="#f472b6" stroke-width="3"/>
    <circle cx="65" cy="95" r="14" fill="#a78bfa" />
    <circle cx="58" cy="93" r="3" fill="#0d0e16" />
    <circle cx="72" cy="93" r="3" fill="#0d0e16" />

    <!-- Details -->
    <text x="125" y="80" font-family="Orbitron" font-size="14" fill="#ffffff" font-weight="bold">MONIR HOSSAIN</text>
    <text x="125" y="98" class="badge-label">ROLE: WEB DEVELOPER</text>
    <text x="125" y="115" class="badge-label">LOC: DHAKA, BD</text>
    <text x="125" y="132" class="badge-label" style="fill:#f472b6;">ID: #DIGI-998</text>
    
    <!-- Simulated Chip and Barcode -->
    <rect x="260" y="68" width="30" height="20" rx="3" fill="#ffd700" fill-opacity="0.8"/>
    <g transform="translate(125, 145)" opacity="0.7">
      <line x1="0" y1="0" x2="160" y2="0" stroke="#fff" stroke-width="8" stroke-dasharray="2,3,1,4,3,2,6"/>
    </g>
  </g>

  <!-- Right Side: Stats dashboard -->
  <g transform="translate(390, 25)">
    <text x="0" y="20" class="dashboard-title">📈 ACTIVITY HUB</text>
    
    <!-- Stats Row 1 -->
    <g transform="translate(0, 45)">
      <text x="0" y="15" class="badge-label">GLOBAL REPOS</text>
      <text x="0" y="42" class="stats-val">99%</text>
    </g>

    <g transform="translate(130, 45)">
      <text x="0" y="15" class="badge-label">TOTAL COMMITS</text>
      <text x="0" y="42" class="stats-val">ACTIVE</text>
    </g>

    <g transform="translate(260, 45)">
      <text x="0" y="15" class="badge-label">HOURS CODING</text>
      <text x="0" y="42" class="stats-val">24/7</text>
    </g>

    <!-- Project mini visualizer -->
    <g transform="translate(0, 110)">
      <text x="0" y="15" class="badge-label">CURRENT BUILD STATUS</text>
      <!-- Progress visual bars -->
      <rect x="0" y="28" width="350" height="12" rx="6" fill="#111221"/>
      <rect x="0" y="28" width="295" height="12" rx="6" fill="url(#stats-gradient)">
        <animate attributeName="width" values="0;295" dur="3s" ease="ease-in-out" fill="freeze"/>
      </rect>
      <text x="295" y="22" font-family="Fira Code" font-size="11" fill="#f472b6" font-weight="bold">LOADING EXPERIENCE...</text>
    </g>
  </g>

  <defs>
    <linearGradient id="stats-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>
</svg>
